updates:
- commit-message:
    prefix: chore(deps)
  directory: /
  groups:
    async-runtime:
      patterns:
      - tokio*
      - async-*
      update-types:
      - minor
      - patch
    dev-dependencies:
      patterns:
      - proptest*
      - test-*
      - criterion*
      update-types:
      - minor
      - patch
    serde-ecosystem:
      patterns:
      - serde*
      update-types:
      - minor
      - patch
  labels:
  - dependencies
  - rust
  open-pull-requests-limit: 10
  package-ecosystem: cargo
  reviewers:
  - zircote
  schedule:
    day: monday
    interval: weekly
    time: "09:00"
    timezone: America/Chicago
- commit-message:
    prefix: chore(deps)
  directory: /
  exclude-paths:
  # gh-aw-generated workflows (gh aw compile). Every action embedded in these
  # files -- not just github/gh-aw-actions/** -- is version-locked to the
  # gh-aw compiler; dependabot hand-editing them would be silently reverted
  # the next time someone runs `gh aw compile`. See #363.
  - ".github/workflows/*.lock.yml"
  groups:
    github-actions:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
  ignore:
  # Belt-and-suspenders alongside exclude-paths above: if github/gh-aw-actions
  # is ever referenced outside a *.lock.yml file, it stays version-locked to
  # the gh-aw compiler rather than bumped by dependabot.
  - dependency-name: "github/gh-aw-actions/**"
  labels:
  - dependencies
  - github-actions
  open-pull-requests-limit: 5
  package-ecosystem: github-actions
  reviewers:
  - zircote
  schedule:
    day: monday
    interval: weekly
    time: "09:00"
    timezone: America/Chicago
version: 2
